name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: api
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: datewise
          POSTGRES_PASSWORD: datewise
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      RAILS_ENV: test
      DB_HOST: localhost
      DB_USER: datewise
      DB_PASSWORD: datewise
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          working-directory: api
          bundler-cache: true
      - name: Rubocop
        run: bundle exec rubocop
      # Not db:prepare: on a new database it also runs db/seeds.rb, and the
      # specs expect an empty test database.
      - name: Prepare database
        run: bin/rails db:create db:schema:load
      # Fails below 90% line coverage (minimum_coverage in spec_helper).
      - name: RSpec
        run: bundle exec rspec
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          if [ -f coverage/.last_run.json ]; then
            {
              echo "### API coverage"
              echo ""
              echo "| Lines | Branches |"
              echo "| --- | --- |"
              echo "| $(jq -r '.result.line' coverage/.last_run.json)% | $(jq -r '.result.branch' coverage/.last_run.json)% |"
              echo ""
              echo "Minimum: 90% of lines. The full HTML report is in this run's artifacts."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: api/coverage
          if-no-files-found: ignore

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Jest
        run: npm test
      # Jest doesn't type-check templates; the production build does.
      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Start the stack
        run: docker compose up -d --build
      # The same command as locally; the tests wait for the stack themselves.
      # Any serious or critical axe violation fails this step.
      - name: Playwright (journeys and axe)
        env:
          CI: 'true'
        run: docker compose --profile e2e run --rm e2e
      - name: Compose logs on failure
        if: failure()
        run: docker compose logs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
