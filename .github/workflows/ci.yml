name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: datewise
          POSTGRES_PASSWORD: datewise
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      RAILS_ENV: test
      DB_HOST: localhost
      DB_USER: datewise
      DB_PASSWORD: datewise
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          working-directory: api
          bundler-cache: true
      - name: Rubocop
        run: bundle exec rubocop
      - name: Prepare database
        run: bin/rails db:prepare
      - name: RSpec
        run: bundle exec rspec

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Jest
        run: npm test
      # Jest doesn't type-check templates; the production build does.
      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: docker compose up -d --build
      # The same command as locally; the tests wait for the stack themselves.
      # Any serious or critical axe violation fails this step.
      - name: Playwright (journeys and axe)
        env:
          CI: 'true'
        run: docker compose --profile e2e run --rm e2e
      - name: Compose logs on failure
        if: failure()
        run: docker compose logs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
