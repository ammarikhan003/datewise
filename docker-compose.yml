# Local development: Postgres, the Rails API and the Angular app.
# Run `docker compose up`; the app is at http://localhost:4200, the API at http://localhost:3000.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER:-datewise}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-datewise}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 2s
      timeout: 5s
      retries: 30

  api:
    build: ./api
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER:-datewise}
      DB_PASSWORD: ${DB_PASSWORD:-datewise}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-change-me}
    ports:
      - "3000:3000"
    volumes:
      - ./api:/app
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    ports:
      - "4200:4200"
    volumes:
      - ./web:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  db-data:
