# Local development: Postgres, the Rails API and the Angular app.
# Run `docker compose up`; the app is at http://localhost:4200, the API at http://localhost:3000.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER:-datewise}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-datewise}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 2s
      timeout: 5s
      retries: 30

  api:
    build: ./api
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER:-datewise}
      DB_PASSWORD: ${DB_PASSWORD:-datewise}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-change-me}
    ports:
      - "3000:3000"
    volumes:
      - ./api:/app
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    environment:
      API_PROXY_TARGET: http://api:3000
    ports:
      - "4200:4200"
    volumes:
      - ./web:/app
      - /app/node_modules
    depends_on:
      - api

  # End-to-end tests: docker compose --profile e2e run --rm e2e
  # Shares the web container network, so the browser sees the app (and the
  # proxied API) at localhost:4200 exactly as a developer does.
  e2e:
    image: mcr.microsoft.com/playwright:v1.48.2-jammy
    profiles: ["e2e"]
    network_mode: "service:web"
    working_dir: /e2e
    environment:
      CI: ${CI:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-change-me}
    volumes:
      - ./e2e:/e2e
      - /e2e/node_modules
    command: sh -c "npm ci --no-audit --no-fund && npx playwright test"
    depends_on:
      - web

volumes:
  db-data:
